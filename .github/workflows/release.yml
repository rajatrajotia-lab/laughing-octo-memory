name: Build app installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bundle app into desktop wrapper
        shell: bash
        run: |
          mkdir -p desktop/app
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png desktop/app/
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows installer and portable exe
        working-directory: desktop
        run: npx electron-builder --win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/HSD-REGISTER-Setup-*.exe
            desktop/dist/HSD-REGISTER-Portable-*.exe

  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bundle app into desktop wrapper
        run: |
          mkdir -p desktop/app
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png desktop/app/
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build Mac app
        working-directory: desktop
        run: npx electron-builder --mac
      - name: Ad-hoc sign so Gatekeeper allows right-click open
        working-directory: desktop/dist
        run: |
          ZIP=$(ls HSD-REGISTER-Mac-*.zip)
          ditto -x -k "$ZIP" unpacked
          codesign --force --deep -s - "unpacked/HSD-REGISTER.app"
          codesign --verify --deep "unpacked/HSD-REGISTER.app"
          rm "$ZIP"
          ditto -c -k --keepParent "unpacked/HSD-REGISTER.app" "$ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: desktop/dist/HSD-REGISTER-Mac-*.zip

  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bundle app into Android assets
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease
      - name: Align and sign APK
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks android/signing.p12 --ks-pass pass:fuelregister \
            --out "HSD-REGISTER-$VERSION.apk" aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: HSD-REGISTER-*.apk

  release:
    needs: [windows, mac, android]
    if: always() && needs.windows.result == 'success' && needs.mac.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: HSD-REGISTER ${{ steps.v.outputs.version }}
          body: |
            ## Easiest install — no security warnings (recommended for office PCs)
            Open **https://rajatrajotia-lab.github.io/laughing-octo-memory/** in Chrome or Edge
            and click the **install icon** at the right end of the address bar (on a phone:
            menu → **Add to Home screen**). Same app, own icon and window, works offline,
            updates itself — and no Windows/Mac security warnings, because nothing is
            downloaded from outside the browser.

            ## Downloaded installers
            These are not from a registered software publisher, so Windows and macOS show
            warnings the first time. That is expected — follow the steps below once.

            **Windows** — `HSD-REGISTER-Setup-${{ steps.v.outputs.version }}.exe`
            1. Double-click the file. If a blue "Windows protected your PC" screen appears,
               click **More info**, then **Run anyway**.
            2. If nothing happens at all, your office antivirus has quarantined it — use the
               browser install at the top instead (it cannot be blocked this way).

            **Mac** — `HSD-REGISTER-Mac-${{ steps.v.outputs.version }}.zip`
            1. Double-click the zip, then drag **HSD-REGISTER** into **Applications**.
            2. First launch only: **right-click (or Control-click) the app → Open → Open**.
               A plain double-click will be refused the first time — that is normal.
            3. If macOS still refuses, open Terminal and paste:
               `xattr -cr "/Applications/HSD-REGISTER.app"` then open it again.

            **Android** — `HSD-REGISTER-${{ steps.v.outputs.version }}.apk`
            Open the file on the phone and allow "install from unknown sources" when asked.
            Installs over older versions; your entries are kept.

            ### Updating
            The **Windows/Mac app updates itself**: at every launch it fetches the
            newest version from the website, and there is a **Check for updates**
            button on the Data Transfer screen. On the **phone app**, Check for
            updates offers the newest APK — install it over the old one and your
            entries are kept. Browser installs always update themselves on refresh.

            ### Share data on the same WiFi
            The Windows/Mac app acts as a data hub: start it on your main computer and a bar
            at the bottom shows an address like `http://192.168.1.5:8785` — open it in a
            browser on any device **on the same WiFi** for the same live data. If Windows
            asks for network permission on first launch, click **Allow**.

            The app works fully offline. Each installation keeps its own data; use the
            in-app Data Transfer screen to move records between systems.
          files: files/*
